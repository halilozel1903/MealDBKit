    <g clip-path="url(#tabletScreen)">
      <rect width="420" height="300" fill="#FFF8EF"/>
      <rect width="110" height="300" fill="#FBEBDD"/>
      <g fill="#E3B597">
        <rect x="16" y="22" width="64" height="9" rx="4.5"/>
        <rect x="16" y="50" width="78" height="22" rx="8" fill="#E8603A"/>
        <rect x="16" y="82" width="70" height="9" rx="4.5"/>
        <rect x="16" y="104" width="58" height="9" rx="4.5"/>
        <rect x="16" y="126" width="74" height="9" rx="4.5"/>
        <rect x="16" y="148" width="52" height="9" rx="4.5"/>
        <rect x="16" y="170" width="66" height="9" rx="4.5"/>
      </g>
      <g transform="translate(126 22)">
        <g>
          <rect width="80" height="80" rx="14" fill="#F7D9C2"/>
          <circle cx="40" cy="40" r="26" fill="url(#plate)"/>
          <circle cx="40" cy="40" r="15" fill="#8DB255"/>
        </g>
        <g transform="translate(94 0)">
          <rect width="80" height="80" rx="14" fill="#F7D9C2"/>
          <circle cx="40" cy="40" r="26" fill="url(#plate)"/>
          <circle cx="40" cy="40" r="15" fill="#D99A3A"/>
        </g>
        <g transform="translate(188 0)">
          <rect width="80" height="80" rx="14" fill="#F7D9C2"/>
          <circle cx="40" cy="40" r="26" fill="url(#plate)"/>
          <circle cx="40" cy="40" r="15" fill="#C4361A"/>
        </g>
        <g transform="translate(0 112)">
          <rect width="80" height="80" rx="14" fill="#F7D9C2"/>
          <circle cx="40" cy="40" r="26" fill="url(#plate)"/>
          <circle cx="40" cy="40" r="15" fill="#E7B04B"/>
        </g>
        <g transform="translate(94 112)">
          <rect width="80" height="80" rx="14" fill="#F7D9C2"/>
          <circle cx="40" cy="40" r="26" fill="url(#plate)"/>
          <circle cx="40" cy="40" r="15" fill="#7A4A2A"/>
        </g>
        <g transform="translate(188 112)">
          <rect width="80" height="80" rx="14" fill="#F7D9C2"/>
          <circle cx="40" cy="40" r="26" fill="url(#plate)"/>
          <circle cx="40" cy="40" r="15" fill="#F2A65A"/>
        </g>
        <g fill="#E3B597">
          <rect x="0" y="88" width="56" height="8" rx="4"/>
          <rect x="94" y="88" width="46" height="8" rx="4"/>
          <rect x="188" y="88" width="60" height="8" rx="4"/>
          <rect x="0" y="200" width="50" height="8" rx="4"/>
          <rect x="94" y="200" width="62" height="8" rx="4"/>
          <rect x="188" y="200" width="44" height="8" rx="4"/>
        </g>
      </g>
    </g>
  </g>

  <!-- iPhone: a recipe -->
  <g transform="translate(940 110)" filter="url(#shadow)">
    <rect x="-12" y="-12" width="260" height="504" rx="40" fill="#2B1A12"/>
    <g clip-path="url(#phoneScreen)">
      <rect width="236" height="480" fill="#FFF8EF"/>
      <rect width="236" height="190" fill="#F3C9A5"/>
      <circle cx="118" cy="104" r="78" fill="url(#plate)"/>
      <circle cx="118" cy="104" r="54" fill="url(#sauce)"/>
      <g stroke="#F6D28A" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M86 92 l22 -12"/>
        <path d="M100 118 l24 -10"/>
        <path d="M120 88 l22 -8"/>
        <path d="M128 124 l20 -12"/>
        <path d="M92 108 l18 -6"/>
      </g>
      <g fill="#4F8A3A">
        <ellipse cx="110" cy="96" rx="9" ry="5" transform="rotate(-30 110 96)"/>
        <ellipse cx="136" cy="110" rx="9" ry="5" transform="rotate(25 136 110)"/>
      </g>
      <rect x="18" y="208" width="150" height="14" rx="7" fill="#2B1A12"/>
      <rect x="18" y="232" width="62" height="20" rx="10" fill="#FBD9C6"/>
      <rect x="86" y="232" width="70" height="20" rx="10" fill="#FBD9C6"/>
      <rect x="18" y="264" width="200" height="34" rx="12" fill="#D62A1E"/>
      <path d="M110 273 l14 8 l-14 8 z" fill="#FFFFFF"/>
      <rect x="18" y="312" width="200" height="150" rx="16" fill="#FFFFFF"/>
      <g fill="#F3E3D5">
        <circle cx="40" cy="338" r="13"/>
        <circle cx="40" cy="372" r="13"/>
        <circle cx="40" cy="406" r="13"/>
        <circle cx="40" cy="440" r="13"/>
      </g>
      <g fill="#E3B597">
        <rect x="62" y="334" width="80" height="8" rx="4"/>
        <rect x="62" y="368" width="64" height="8" rx="4"/>
        <rect x="62" y="402" width="90" height="8" rx="4"/>
        <rect x="62" y="436" width="56" height="8" rx="4"/>
        <rect x="170" y="334" width="34" height="8" rx="4"/>
        <rect x="176" y="368" width="28" height="8" rx="4"/>
        <rect x="166" y="402" width="38" height="8" rx="4"/>
        <rect x="174" y="436" width="30" height="8" rx="4"/>
      </g>
    </g>
  </g>
</svg>
