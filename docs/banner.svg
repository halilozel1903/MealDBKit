<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#FBE3CC"/>
    </linearGradient>
    <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8603A"/>
      <stop offset="1" stop-color="#C4361A"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE6DC"/>
    </radialGradient>
    <radialGradient id="sauce" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#F0703F"/>
      <stop offset="1" stop-color="#B83218"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7A3A12" flood-opacity="0.18"/>
    </filter>
    <clipPath id="phoneScreen"><rect x="0" y="0" width="236" height="480" rx="30"/></clipPath>
    <clipPath id="tabletScreen"><rect x="0" y="0" width="420" height="300" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1130" cy="90" r="190" fill="#F6C9A6" opacity="0.35"/>
  <circle cx="760" cy="640" r="160" fill="#F6C9A6" opacity="0.30"/>

  <!-- Title -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="80" y="112" width="64" height="64" rx="16" fill="url(#tomato)"/>
    <g transform="translate(112 144)" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
      <path d="M-17 2 h34 a17 17 0 0 1 -34 0 z" fill="#FFFFFF" stroke="none"/>
      <path d="M-8 -6 q4 -6 0 -12"/>
      <path d="M2 -6 q4 -6 0 -12"/>
      <path d="M12 -6 q4 -6 0 -12"/>
    </g>
    <text x="80" y="262" font-size="84" font-weight="800" fill="#2B1A12" letter-spacing="-2">MealDBKit</text>
    <text x="82" y="312" font-size="26" fill="#6B4A38">A Swift client for TheMealDB</text>
    <text x="82" y="346" font-size="26" fill="#6B4A38">with a SwiftUI recipe app</text>
    <text x="82" y="380" font-size="26" fill="#6B4A38">for iPhone and iPad.</text>

    <g font-size="19" font-weight="600" transform="translate(0 22)">
      <rect x="80" y="400" width="196" height="42" rx="21" fill="#FFFFFF" stroke="#F0C9AC"/>
      <text x="178" y="427" text-anchor="middle" fill="#C4361A">Search &amp; lookup</text>
      <rect x="290" y="400" width="244" height="42" rx="21" fill="#FFFFFF" stroke="#F0C9AC"/>
      <text x="412" y="427" text-anchor="middle" fill="#C4361A">Categories · Cuisines</text>
      <rect x="80" y="456" width="234" height="42" rx="21" fill="#FFFFFF" stroke="#F0C9AC"/>
      <text x="197" y="483" text-anchor="middle" fill="#C4361A">Typed ingredients</text>
      <rect x="328" y="456" width="206" height="42" rx="21" fill="#FFFFFF" stroke="#F0C9AC"/>
      <text x="431" y="483" text-anchor="middle" fill="#C4361A">Image URL sizes</text>
      <rect x="80" y="512" width="180" height="42" rx="21" fill="url(#tomato)"/>
      <text x="170" y="539" text-anchor="middle" fill="#FFFFFF">iPhone + iPad</text>
      <rect x="274" y="512" width="160" height="42" rx="21" fill="#2B1A12"/>
      <text x="354" y="539" text-anchor="middle" fill="#FFFFFF">Swift 6.2</text>
    </g>
  </g>

  <!-- iPad: category grid -->
